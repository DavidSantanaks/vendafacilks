name: Qualidade e isolamento
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - run: npm audit --prefix tooling --audit-level=high
      - run: npm run vendor --prefix tooling
      - run: npm run lint --prefix tooling
      - run: npm run format:check --prefix tooling
      - run: node --test tooling/validate-commit.test.mjs
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes
          path: target/surefire-reports
